<svg width="600" height="30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .marquee {
      animation: scroll 12s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(600px); }
      to   { transform: translateX(-100%); }
    }
    text {
      font-family: monospace;
      font-size: 14px;
      fill: #cccccc;
    }
  </style>
  <g class="marquee">
    <text y="20">Just building stuff that works · Systems engineering · Docker · Always shipping · C++ · Rust · Java</text>
  </g>
</svg>
