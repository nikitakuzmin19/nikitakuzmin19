<svg width="600" height="30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .marquee {
      animation: scroll 16s linear infinite;
    }
    @keyframes scroll {
      from { transform: translateX(600px); }
      to   { transform: translateX(-125%); }
    }
    text {
      font-family: monospace;
      font-size: 14px;
      fill: #999999;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
  <g class="marquee">
    <text y="20">Just building stuff that works · Systems engineering · Docker · Always shipping · C++ · Rust · Java</text>
  </g>
</svg>
